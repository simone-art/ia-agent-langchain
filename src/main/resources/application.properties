spring.application.name=springboot

# ===============================
# Configurações do Banco de Dados MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/products_api?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=banco123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Configurações do JPA/Hibernate
# ===============================
# Estratégia de criação do schema (create, create-drop, update, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Dialeto do MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar SQL no console (desabilitar em produção)
spring.jpa.show-sql=true

# Formatar SQL para melhor leitura
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Configurações do HikariCP (Pool de Conexões)
# ===============================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

